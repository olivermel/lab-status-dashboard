apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-status-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-status-dashboard
  template:
    metadata:
      labels:
        app: lab-status-dashboard
    spec:
      containers:
        - name: dashboard
          image: lab-status-dashboard:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-status-dashboard
spec:
  selector:
    app: lab-status-dashboard
  ports:
    - port: 80
      targetPort: 80
